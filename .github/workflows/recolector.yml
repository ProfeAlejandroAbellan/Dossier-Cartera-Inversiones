name: Recolector de vídeos de divulgadores

on:
  schedule:
    - cron: "0 16 * * *"   # cada día a las 16:00 UTC (18:00 en Madrid en verano): avisa de vídeos nuevos
  workflow_dispatch: {}     # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  issues: write

concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "youtube-transcript-api>=1.2" requests
      - name: Recoger vídeos nuevos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
        run: python agente/recolector.py
      - name: Guardar en el repositorio
        if: always()
        run: |
          git config user.name "recolector-bot"
          git config user.email "recolector-bot@users.noreply.github.com"
          git add agente/
          git diff --cached --quiet || git commit -m "Recolector: vídeos nuevos $(date +%F)"
          git pull --rebase -q origin main && git push
