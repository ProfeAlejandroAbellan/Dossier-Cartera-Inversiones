name: Recolector de vídeos de divulgadores

on:
  schedule:
    - cron: "0 19 * * 6"   # sábados 19:00 UTC (21:00 en Madrid en verano); el analista corre el domingo por la mañana
  workflow_dispatch: {}     # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "youtube-transcript-api>=1.2" requests
      - name: Recoger vídeos nuevos
        env:
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
        run: python agente/recolector.py
      - name: Guardar en el repositorio
        if: always()
        run: |
          git config user.name "recolector-bot"
          git config user.email "recolector-bot@users.noreply.github.com"
          git add agente/
          git diff --cached --quiet || git commit -m "Recolector: vídeos de la semana $(date +%F)"
          git push
